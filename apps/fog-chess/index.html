<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fog Chess</title>
  <link rel="icon" href="pieces/bN.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script src="sound.js"></script>
  <script type="module" src="main.js"></script>
</head>
<body>
  <main class="layout">
    <aside class="panel setup-panel">
      <nav class="help-link"><a href="help.html" target="_blank" rel="noopener">Help</a></nav>

      <section id="setup" class="card setup">
        <header class="panel-head">
          <h1>Fog Chess</h1>
        </header>

        <form id="new-game">
          <h2>New game</h2>
          <fieldset class="colors">
            <legend>Play as</legend>
            <label><input type="radio" name="color" value="white" checked> White</label>
            <label><input type="radio" name="color" value="black"> Black</label>
            <label><input type="radio" name="color" value="random"> Random</label>
          </fieldset>
          <fieldset class="strength">
            <legend>AI strength</legend>
            <div class="strength-row">
              <select id="strength-mode" aria-label="Limit the AI by">
                <option value="power">Power</option>
                <option value="time">Time</option>
              </select>
              <label id="power-field">
                <input id="power" type="number" min="0" step="1" value="25" required aria-label="Power">
              </label>
              <label id="time-field" hidden>
                <input id="time-ms" type="number" min="0" max="600000" step="100" value="2000" required aria-label="Move time">
                <span>ms per move</span>
              </label>
            </div>
          </fieldset>
          <button type="submit">Start</button>
        </form>
      </section>

      <section id="archive" class="card" hidden>
        <h2>Past games</h2>
        <ol id="archive-list" class="archive-list"></ol>
      </section>

      <section id="review" class="card" hidden>
        <h2>Review</h2>
        <p id="review-info" class="game-info"></p>
        <p id="review-status" class="review-status"></p>
        <div class="review-fog">
          <span class="review-fog-label">Fog</span>
          <div id="review-fog" class="seg" role="group" aria-label="Show the board as one side saw it">
            <button type="button" data-fog="off">Off</button>
            <button type="button" data-fog="white">White</button>
            <button type="button" data-fog="black">Black</button>
            <button type="button" data-fog="active" title="Whichever side is to move on the board">To move</button>
          </div>
        </div>
        <button id="review-line" type="button" class="outline review-line" hidden title="Leave your own line for the game's moves">Back to the game</button>
        <button id="review-close" type="button" class="outline">Close</button>
      </section>

      <section id="taken" class="card" hidden>
        <h2>Taken</h2>
        <div class="taken-row">
          <span class="taken-label">You took</span>
          <span id="taken-by-you" class="taken-pieces"></span>
          <span id="edge-you" class="taken-edge"></span>
        </div>
        <div class="taken-row">
          <span class="taken-label">You lost</span>
          <span id="taken-from-you" class="taken-pieces"></span>
          <span id="edge-ai" class="taken-edge"></span>
        </div>
      </section>

      <div id="fog-card" class="card" hidden>
        <label class="toggle">
          <input id="show-belief" type="checkbox">
          <span>Show where the enemy might be</span>
        </label>
        <p id="belief-note" class="note"></p>
      </div>
    </aside>

    <section class="board-wrap">
      <div class="board-frame">
        <div id="board" class="board" role="grid" aria-label="Chess board"></div>
        <svg id="arrows" class="arrows" viewBox="0 0 8 8" aria-hidden="true"></svg>
        <div id="promotion" class="promotion" hidden></div>
      </div>
      <p id="error" class="error" role="alert" hidden></p>
    </section>

    <aside class="panel game-panel">
      <section id="in-game" class="card" hidden>
        <h2>Game <span id="thinking" class="spinner" title="Opponent is thinking" hidden></span></h2>
        <p id="game-info" class="game-info"></p>
        <button id="resign" type="button" class="outline resign">Resign</button>
      </section>

      <section id="analysis" class="card analysis" hidden>
        <header class="an-head">
          <h2>Analysis <span id="an-spinner" class="spinner" title="Analyzing…" hidden></span></h2>
          <div class="an-tools">
            <button id="an-pause" type="button" class="an-pause">❙❙ Pause</button>
            <div class="seg" role="group" aria-label="Analysis">
              <button id="an-on" type="button">On</button>
              <button id="an-off" type="button">Off</button>
            </div>
          </div>
        </header>
        <div id="an-body">
          <p id="an-progress" class="an-progress"></p>
          <p id="an-msg" class="an-msg"></p>
          <ol id="an-rows" class="an-rows"></ol>
          <div id="bw" class="bw" hidden>
            <select id="bw-order" title="Order the possible boards by how likely they are, or by how good one move looks in them"></select>
            <div class="bw-step">
              <button id="bw-prev" type="button" title="Previous board">◀</button>
              <input id="bw-n" type="number" min="1" value="1" aria-label="Board number">
              <span id="bw-of"></span>
              <button id="bw-next" type="button" title="Next board">▶</button>
              <span id="bw-scope" class="bw-scope"></span>
            </div>
            <p id="bw-label" class="bw-label"></p>
            <p id="bw-warn" class="bw-warn" hidden></p>
          </div>
        </div>
      </section>

      <div id="moves-card" class="card" hidden>
        <header class="moves-head">
          <h2>Moves</h2>
          <div id="export" class="export" hidden>
            <button type="button" data-download="pgn" title="Download as PGN">PGN</button>
            <button type="button" data-download="text" title="Download as text">Text</button>
            <button type="button" data-download="uci" title="Download as UCI">UCI</button>
          </div>
        </header>
        <ol id="moves" class="moves"></ol>
      </div>
    </aside>
  </main>
</body>
</html>
